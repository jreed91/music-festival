name: Hinterland
options:
  bundleIdPrefix: com.jreed91
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or pick the team in Xcode's
    # Signing & Capabilities tab, which writes it back into the project).
    DEVELOPMENT_TEAM: ""

targets:
  Hinterland:
    type: application
    platform: iOS
    sources:
      - path: Hinterland
      # Added as individual files, not a folder reference, so they land at the bundle
      # root where Bundle.main.url(forResource:withExtension:) finds them.
      - path: Data/schedule.json
        buildPhase: resources
      - path: Data/info.json
        buildPhase: resources
      - path: Data/map.json
        buildPhase: resources
      - path: Data/vendors.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jreed91.hinterland
        PRODUCT_NAME: Hinterland
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      # Embeds the widget extension in the app bundle.
      - target: HinterlandWidgets
    # WeatherKit needs the capability on the App ID in the developer portal as well as
    # the entitlement here; without both, every forecast request fails to authenticate.
    # The app group is the same story, and it's what lets the widget — a separate process
    # with its own sandbox — read the starred sets and the cached schedule.
    entitlements:
      path: Hinterland/Hinterland.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.com.jreed91.hinterland
    info:
      path: Hinterland/Info.plist
      properties:
        CFBundleDisplayName: Hinterland
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        # Without this the Live Activity request fails at runtime with no other clue.
        NSSupportsLiveActivities: true
        # The widget and the Live Activity open the app on My Lineup through this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: com.jreed91.hinterland
            CFBundleURLSchemes:
              - hinterland
        # Only used to draw the blue dot on the grounds map. Nothing is stored or sent.
        NSLocationWhenInUseUsageDescription: Shows where you are on the festival grounds
          map. Your location stays on your phone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Declares no non-exempt encryption, which skips the export-compliance
        # prompt on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false

  # The Home/Lock Screen widget and the Live Activity presentation. A widget runs in its
  # own process, so anything it draws has to come from the app group or from its own
  # bundle — hence the shared sources and its own copy of schedule.json.
  HinterlandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HinterlandWidgets
      # Compiled into both targets: the models, the starred sets, the palette, and the
      # rule for which set to feature. One copy, so the widget can't disagree with the app.
      - path: Hinterland/Shared
      # The offline fallback, for a phone that has never had signal since installing.
      - path: Data/schedule.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jreed91.hinterland.widgets
        PRODUCT_NAME: HinterlandWidgets
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: HinterlandWidgets/HinterlandWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jreed91.hinterland
    info:
      path: HinterlandWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hinterland
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
